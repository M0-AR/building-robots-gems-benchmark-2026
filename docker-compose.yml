version: "3.9"
services:
  gems-benchmark:
    build: .
    container_name: gems-benchmark
    volumes:
      - ./results:/work/results
      - ./data:/work/data
    environment:
      - PYTHONPATH=/work/src
    command: python scripts/run_all.py
  gems-verify:
    build: .
    depends_on:
      - gems-benchmark
    volumes:
      - ./results:/work/results
    environment:
      - PYTHONPATH=/work/src
    command: python scripts/verify.py
